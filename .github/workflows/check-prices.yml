name: Check prices

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths: ["watchlist.csv"]

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check prices and save them
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MOVE_THRESHOLD_PCT: ${{ vars.MOVE_THRESHOLD_PCT || '3' }}
        run: |
          git config user.name "price-tracker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # if another run pushed first, redo the check on top of its data
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python check_prices.py
            git add data/
            if git diff --cached --quiet; then
              echo "nothing to save"
              exit 0
            fi
            git commit --quiet -m "Price check $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            echo "push rejected, retrying ($attempt)"
            sleep $((attempt * 5))
          done
          echo "gave up after 3 attempts"
          exit 1
